<div class="cart-page">
  <!-- Back link -->
  <a routerLink="/games" class="cart-page__back-link">&#8592; Continue Shopping</a>

  <!-- Page heading -->
  <h1 class="cart-page__heading">Your Cart</h1>

  <!-- Skeleton while loading -->
  <ng-container *ngIf="loading">
    <app-skeleton width="100%" height="80px" borderRadius="8px"></app-skeleton>
    <app-skeleton width="100%" height="80px" borderRadius="8px"></app-skeleton>
    <app-skeleton width="100%" height="80px" borderRadius="8px"></app-skeleton>
  </ng-container>

  <!-- Cart content after load -->
  <ng-container *ngIf="!loading">
    <ng-container *ngIf="cartItems$ | async as cartItems">

      <!-- Empty state -->
      <app-empty-state
        *ngIf="cartItems.length === 0"
        message="No items in your cart."
        ctaLabel="Browse Games"
        ctaLink="/games">
      </app-empty-state>

      <!-- Cart items list -->
      <ul *ngIf="cartItems.length > 0" class="cart-page__list" role="list" aria-label="Cart items">
        <li *ngFor="let item of cartItems" role="listitem">
          <app-cart-item-row
            [item]="item"
            (quantityChange)="onQuantityChange($event)"
            (remove)="onRemoveItem($event)">
          </app-cart-item-row>
        </li>
      </ul>

      <!-- Running total -->
      <div *ngIf="cartItems.length > 0" class="cart-page__total">
        <span class="cart-page__total-label">Total:</span>
        <span class="cart-page__total-value">{{ getRunningTotal(cartItems) | currency:'USD':'symbol':'1.2-2' }}</span>
      </div>

      <!-- CTA -->
      <div *ngIf="cartItems.length > 0" class="cart-page__cta">
        <button mat-flat-button
                class="cart-page__checkout-btn"
                [disabled]="cartItems.length === 0"
                (click)="onProceedToCheckout()">
          Proceed to Checkout
        </button>
      </div>

    </ng-container>
  </ng-container>
</div>
