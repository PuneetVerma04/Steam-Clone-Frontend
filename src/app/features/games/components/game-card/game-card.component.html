<div class="game-card" *ngIf="game; else skeletonTpl"
     [routerLink]="['/games', game.id]"
     role="link"
     tabindex="0"
     [attr.aria-label]="game.title">
  <div class="game-card__image-wrapper">
    <img
      [src]="game.imageUrl"
      [alt]="game.title + ' cover art'"
      (error)="onImageError($event)"
      class="game-card__image"
    />
  </div>
  <div class="game-card__body">
    <span class="game-card__genre">{{ game.genre }}</span>
    <h3 class="game-card__title">{{ game.title }}</h3>
    <p class="game-card__publisher">{{ game.publisherName }}</p>
    <p class="game-card__price">${{ game.price | number:'1.2-2' }}</p>
    <button
      mat-flat-button
      class="game-card__cta"
      [attr.aria-label]="'Add ' + game.title + ' to cart'"
      (click)="$event.stopPropagation(); onAddToCart()"
    >
      Add to Cart
    </button>
  </div>
</div>

<ng-template #skeletonTpl>
  <div class="game-card game-card--skeleton" aria-hidden="true">
    <app-skeleton width="100%" height="200px" borderRadius="0"></app-skeleton>
    <div class="game-card__body">
      <app-skeleton width="70%" height="18px" borderRadius="4px"></app-skeleton>
      <app-skeleton width="40%" height="14px" borderRadius="4px"></app-skeleton>
    </div>
  </div>
</ng-template>
